<!-- @dsCard group="Type" viewport="700x260" name="Display & Heading Scale" subtitle="Tailwind size ramp, weight 700 / tracking -0.02em." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:20px}
  .swatches{display:flex;gap:0;border:1px solid var(--border)}
  .sw{flex:1;display:flex;flex-direction:column}
  .sw .chip{height:60px}
  .sw .cap{padding:7px 9px;font-size:11px;line-height:1.35;border-top:1px solid var(--border)}
  .sw .cap b{display:block;font-weight:600;font-size:11.5px;letter-spacing:.01em}
  .sw .cap span{color:var(--muted-foreground);font-size:10px}
  .sw + .sw{border-left:1px solid var(--border)}
  .ramp{display:flex;height:70px;border:1px solid var(--border)}
  .ramp div{flex:1}
  .ramplbl{display:flex;margin-top:6px}
  .ramplbl div{flex:1;text-align:center;font-size:10px;color:var(--muted-foreground)}
  .r{display:flex;align-items:baseline;gap:14px;margin:2px 0}.r span{font-size:11px;color:var(--muted-foreground);width:70px;flex-shrink:0}.r b{font-weight:700;letter-spacing:-0.02em;line-height:1.15}
</style></head><body>
<div class="r"><span>5xl · 48</span><b style="font-size:48px">Coverage</b></div>
<div class="r"><span>3xl · 30</span><b style="font-size:30px">Cluster Priangan</b></div>
<div class="r"><span>2xl · 24</span><b style="font-size:24px">Session Record</b></div>
<div class="r"><span>xl · 20</span><b style="font-size:20px">Perjadin Bandung–Garut</b></div>
<div class="r"><span>lg · 18</span><b style="font-size:18px">Advance &amp; acquittal</b></div></body></html>
