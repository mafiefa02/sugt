# Two apps, sharing packages — see docs/adr/0002-two-apps-in-a-pnpm-workspace.md.
#
# The ADR-0001 boundary (internal narrative never reaches a public page) is held
# by pnpm's default strict, symlinked node_modules: `@sugt/public` can only
# import packages it declares in its own package.json. Setting `node-linker=hoisted`
# or `shamefully-hoist=true` in an .npmrc would downgrade that boundary back to a
# convention. Don't.
packages:
  - apps/*
  - packages/*

# Single source of truth for versions shared by both apps. Two Next apps drifting
# on React versions is exactly what this prevents; depend on `catalog:` not a range.
catalog:
  "@base-ui/react": ^1.7.0
  "@hugeicons/core-free-icons": ^4.2.3
  "@hugeicons/react": ^1.1.9
  "@tailwindcss/postcss": ^4
  "@types/node": ^20
  "@types/react": ^19
  "@types/react-dom": ^19
  babel-plugin-react-compiler: 1.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  next: 16.2.12
  react: 19.2.4
  react-dom: 19.2.4
  shadcn: ^4.16.1
  tailwind-merge: ^3.6.0
  tailwindcss: ^4
  tw-animate-css: ^1.4.0
  typescript: ^7

allowBuilds:
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
